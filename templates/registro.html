<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="navbar">
        <a class="logo" href="/">💡 Organizador de ideas</a>
        <nav>
            <a href="/">Inicio</a>
            <a href="/registro">Crear cuenta</a>
        </nav>
    </header>

    <main class="contenedor">
        <form class="tarjeta-form" method="POST">
            <h1>Crear cuenta</h1>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="campo">
                <label for="cumpleanos">Cumpleaños</label>
                <input type="date" id="cumpleanos" name="cumpleanos" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="campo">
                <label for="color">Color favorito</label>
                <input type="color" id="color" name="color" value="#6c5ce7">
            </div>

            <button class="boton" type="submit">Registrarme</button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
